# Netlify — Next.js (App Router) via OpenNext adapter (auto-détecté)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma a besoin de ces binaires sur les builders Netlify
  PRISMA_CLI_BINARY_TARGETS = "native,rhel-openssl-3.0.x"
  # Les secrets serveur sont injectés dans les bundles Functions Next.js — attendu, pas une fuite publique.
  # https://docs.netlify.com/build/environment-variables/secrets-controller/
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,CLERK_SECRET_KEY,CLERK_WEBHOOK_SECRET,CRON_SECRET,RESEND_API_KEY,STREAM_API_SECRET,OPENAI_API_KEY,GEMINI_API_KEY,VAPID_PRIVATE_KEY,E_URL"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,node_modules/**"

# Ne pas pinner @netlify/plugin-nextjs : Netlify injecte / met à jour l’adapter OpenNext à chaque build.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rappels événements J-1 — tous les jours à 08:00 UTC
[functions."event-reminders"]
  schedule = "0 8 * * *"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
