# Netlify — Next.js (App Router) via OpenNext adapter (auto-détecté)
# Docs: https://docs.netlify.com/integrations/frameworks/next-js/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Ne pas définir PRISMA_CLI_BINARY_TARGETS ici : "native" n'y est pas valide et casse `prisma generate`.
  # Les targets sont dans prisma/schema.prisma (native + rhel-openssl-3.0.x).
  # Next.js copie les env serveur dans les Functions. Plusieurs vars Netlify
  # (DATABASE="Epi'AI", OPENAI_CHATBOT_MODEL, MONGODB_URI localhost) matchent
  # du texte public du repo → faux positifs. On désactive le scan.
  SECRETS_SCAN_ENABLED = "false"

# Ne pas pinner @netlify/plugin-nextjs : Netlify injecte / met à jour l’adapter OpenNext à chaque build.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rappels événements J-1 — tous les jours à 08:00 UTC
[functions."event-reminders"]
  schedule = "0 8 * * *"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
